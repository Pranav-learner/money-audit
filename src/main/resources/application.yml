spring:
  application:
    name: money-audit

  datasource:
    url: jdbc:postgresql://localhost:5432/finance_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  # File uploads (receipts / profile images -> MultipartFile)
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # Spring Mail (JavaMailSender is auto-configured from these properties)
  mail:
    host: smtp.gmail.com
    port: 587
    username: YOUR_EMAIL@gmail.com
    password: YOUR_APP_PASSWORD
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Thread pool for @Scheduled report jobs
  task:
    scheduling:
      pool:
        size: 5

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# JWT auth (consumed by JwtService)
jwt:
  secret: thisIsASecretKeyForFinanceTrackerProject123456
  expiration: 86400000

# Razorpay payments (consumed by RazorpayConfig / RazorpayService)
razorpay:
  key-id: YOUR_RAZORPAY_KEY_ID
  key-secret: YOUR_RAZORPAY_SECRET
  currency: INR

# Cloudinary image hosting (consumed by CloudinaryConfig; falls back to demo if empty)
cloudinary:
  url: ${CLOUDINARY_URL:}

# OCR receipt scanning (consumed by OcrService / ReceiptService)
ocr:
  tesseract:
    datapath: /usr/share/tessdata
    language: eng
  upload-dir: uploads/receipts

# Financial Risk Detection Engine (Module 2) — thresholds bound to RiskThresholdProperties.
# Tune these per deployment without any code change; defaults are applied when values are omitted.
risk:
  debt-threshold: 10000           # ₹ owed at/above which a debt risk is raised
  overdue-settlement-count: 3     # unsettled settlements at/above which a debt risk is raised
  budget-warn-percent: 80         # budget % → MEDIUM budget risk
  budget-over-percent: 100        # budget % → HIGH budget risk
  cashflow-min-elapsed-days: 5    # days into month before projecting cash flow
  cashflow-overrun-buffer: 0.0    # extra fraction over budget before flagging (0 = strict)
  savings-decline-percent: 25     # % drop vs recent average that flags a savings risk
  savings-gap-days: 45            # days without saving that constitutes a gap
  subscription-min-months: 3      # months a charge must recur to count as a subscription
  subscription-cost-threshold: 500 # ₹/month at/above which a subscription is "expensive"
  spike-multiplier: 1.75          # weekly spend multiple over baseline that is a spike
  spike-min-weekly-amount: 1000   # ₹ floor below which weekly spikes are ignored
  recurring-due-window-days: 5    # remind this many days before a recurring bill is due
  anomaly-z-score: 2.5            # z-score at/above which a transaction is anomalous
  anomaly-high-z-score: 3.5       # z-score at/above which an anomaly is HIGH severity
  repeated-transaction-count: 4   # identical charges in a month that flag repeated activity

# Personalized Recommendation Engine (Module 4) — thresholds bound to RecommendationProperties.
recommendation:
  min-savings-threshold: 100      # ₹/month floor below which a saving recommendation is suppressed
  max-recommendations-per-user: 8 # cap on active recommendations surfaced per user
  confidence-threshold: 0.5       # drop recommendations below this confidence
  priority-threshold: 0.0         # minimum composite priority score (0–100) to keep a recommendation
  expiration-days: 30             # days a recommendation stays ACTIVE
  top-count: 3                    # number of "top" recommendations for /top and dashboard
  emergency-fund-months: 6        # months of spending used as the emergency-fund target
  target-savings-rate: 0.20       # savings-rate goal used by the savings recommendation

# Forecasting & Financial Planning Engine (Module 5) — bound to ForecastProperties.
forecast:
  forecast-window-months: 6            # trailing months used for prediction baselines
  goal-confidence-threshold: 0.5       # success probability at/below which a goal is at-risk
  max-goal-duration-months: 120        # longest realistic target horizon the planner suggests
  prediction-history-days: 90          # days of forecast history retained per type
  notification-progress-threshold: 0.8 # goal progress fraction that triggers a positive nudge
  goal-delay-notification-months: 2    # projected delay (months) beyond which the user is warned

# AI Financial Assistant (Final Module) — bound to AiAssistantProperties.
# The default 'template' provider is fully offline and never invents numbers. Swap `provider` to a
# generative adapter (openai/anthropic/azure/google) without any orchestration code change.
ai:
  provider: template
  model: money-audit-assistant
  temperature: 0.2
  max-tokens: 600
  request-timeout-ms: 15000
  conversation-history-size: 10
  tool-logging-enabled: true
